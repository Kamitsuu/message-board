<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Message Board</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Community board</p>
        <h1>What's on your mind?</h1>
      </header>

      <form id="post-form" class="composer">
        <label for="name">Name</label>
        <input id="name" name="name" maxlength="50" autocomplete="name" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" maxlength="1000" rows="4" required></textarea>

        <div class="composer-actions">
          <p id="form-status" role="status" aria-live="polite"></p>
          <button type="submit">Post message</button>
        </div>
      </form>

      <section aria-labelledby="posts-heading">
        <h2 id="posts-heading">Latest messages</h2>
        <div id="posts" class="posts"></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
